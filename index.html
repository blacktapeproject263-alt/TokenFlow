<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Antigravity 2.0 — Token Budget Telemetry Widget</title>
  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 0%, #1e1b4b 0%, #0f172a 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #f8fafc;
    }
    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .header-info {
      text-align: center;
    }
    .header-info h1 {
      margin: 0 0 8px 0;
      font-size: 1.6rem;
      background: linear-gradient(135deg, #a5b4fc, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header-info p {
      margin: 0;
      color: #94a3b8;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-info">
      <h1>Antigravity Token Telemetry</h1>
      <p>Real-time context window budget monitor & quota simulator</p>
    </div>

    <!-- The custom element -->
    <token-budget-widget limit="1000000" used="145000"></token-budget-widget>
  </div>

  <script type="module" src="./src/token-widget.js"></script>
</body>
</html>
